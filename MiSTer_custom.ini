[MiSTer]
; =====================
; DISPLAY SETTINGS
; =====================

; Video mode: 0=720p60, 1=1024x768, 2=480p, 3=576p, 4=1280x1024, 5=800x600, 
;             6=640x480, 7=720p50, 8=1080p60, 9=1080p50, 10=1366x768,
;             11=1024x600, 12=1920x1440, 13=2048x1536, 14=2560x1440
video_mode=8

; DVI mode (no audio over HDMI)
;dvi_mode=0

; VSync adjust: 0=off, 1=auto adjust, 2=low latency (single buffer)
vsync_adjust=0
refresh_min=0
refresh_max=0
;video_mode_ntsc=0
;video_mode_pal=7

; Video info display: 1-10 seconds, 0=disabled
video_info=0

; HDR: 0=off, 1=BT2020, 2=DCI P3, 3=no color space conversion
hdr=0
; HDR brightness settings (for HDR-enabled displays)
hdr_max_nits=1000
hdr_avg_nits=250

; HDMI limited color range: 0=full, 1=limited (16-235), 2=limited (16-255)
hdmi_limited=0

; Direct video (for VGA converters): 0=off, 1=enabled
direct_video=0

; VRR (Variable Refresh Rate)
vrr_mode=0
vrr_min_framerate=0
vrr_max_framerate=0
vrr_vesa_framerate=0

; HDMI game mode (0=normal, 1=game mode for lower latency on some displays)
hdmi_game_mode=0

; =====================
; SCALING & BORDERS
; =====================

; VScale mode: 0=fit screen, 1=integer only, 2=0.5 steps, 3=0.25 steps
;              4=integer res (core AR), 5=integer res (display AR)
vscale_mode=0
vscale_border=0

; Framebuffer: 0=auto, 1=full, 2=1/2 res, 4=1/4 res
fb_size=0
fb_terminal=1

; =====================
; VGA OUTPUT
; =====================

; VGA mode: rgb, ypbpr, svideo, cvbs, subcarrier
vga_mode=rgb
; NTSC mode (for S-Video/CVBS): 0=NTSC, 1=PAL-60, 2=PAL-M
ntsc_mode=0
; Subcarrier generator for composite video (0=disabled, 1=enabled)
subcarrier=0

forced_scandoubler=0
ypbpr=0
composite_sync=0
vga_scaler=0
vga_sog=0

; =====================
; AUDIO
; =====================

; HDMI audio: 0=48kHz/16bit, 1=96kHz/16bit
hdmi_audio_96k=0

; =====================
; COLOR CONTROLS
; =====================

video_brightness=50
video_contrast=50
video_saturation=100
video_hue=0
video_gain_offset=1,0,1,0,1,0

; =====================
; OSD & MENU
; =====================

; OSD timeout (5-3600 seconds, 0=never)
osd_timeout=30
osd_rotate=0
video_off=0

; OSD lock protection (U=Up, D=Down, L=Left, R=Right, A=Select, B=Back)
;osd_lock=DUUUD
osd_lock_time=5

; Menu settings
menu_pal=0
logo=0

; Hide datecodes from RBF filenames (F2 to toggle)
rbf_hide_datecode=0

; Expand long filenames in browser (0=single line, 1=two lines)
browse_expand=1

; Recent files (WARNING: increases SD card writes)
recents=0

; Autoboot settings
;bootcore=lastcore
bootcore_timeout=10

; Custom font
font=font/myfont.pf

; =====================
; INPUT & CONTROLLERS
; =====================

key_menu_as_rgui=0
keyrah_mode=0x18d80002

; Reset combo: 0=lctrl+lalt+ralt, 1=lctrl+lgui+rgui, 2=lctrl+lalt+del
reset_combo=0

; Controller info display (1-10 seconds, 0=disabled)
controller_info=6

; Gamepad mapping: 0=name mapping, 1=positional mapping
gamepad_defaults=0

; Sniper mode: 0=default, 1=swapped speeds
sniper_mode=0

; Controller rumble (0=disabled, 1=enabled)
rumble=1

; Wheel settings (for steering wheel controllers)
;wheel_force=50
;wheel_range=200

; Per-controller unique mapping (0=disabled, or VIDPID for specific device)
controller_unique_mapping=0

; JammaSD/J-PAC settings
jamma_vid=0x04D8
jamma_pid=0xF3AD

; Player controller assignments (uncomment and configure as needed)
;player_1_controller=usb-1.2/
;player_2_controller=
;player_3_controller=
;player_4_controller=

; Device merge override (uncomment if only player 1 works)
;no_merge_vid=0x045E
;no_merge_pid=0x028E

; =====================
; BLUETOOTH
; =====================

bt_auto_disconnect=0
bt_reset_before_pair=0

; =====================
; MISC
; =====================

; Autofire disable
disable_autofire=0

; Log file entry for external integration
log_file_entry=0

; Shared folder (for minimig/ao486)
shared_folder=

; Custom aspect ratios
;custom_aspect_ratio_1=16:10
;custom_aspect_ratio_2=1:1

; Spinner/paddle settings
;spinner_vid=0x1BCF
;spinner_pid=0x0005
;spinner_throttle=-50
;spinner_axis=1

; Default filters
;vfilter_default=
;vfilter_vertical_default=
;vfilter_scanlines_default=
;vfilter_interlace_default=
;afilter_default=

; Shadow mask
;shmask_default=VGA.txt
;shmask_mode_default=1

; Default video processing preset (relative to presets/ folder)
;preset_default=General Hardware/Console - 3rdGen

; Wait for mount (for USB/network games folders)
;waitmount=/media/usb0

; =====================
; CORE-SPECIFIC OVERRIDES
; =====================

[Amiga+Amiga500+Amiga500HD+Amiga600HD]
video_mode_ntsc=8
video_mode_pal=9
vscale_mode=0
vsync_adjust=1
custom_aspect_ratio_1=40:27
bootscreen=0

; Video mode overrides by resolution
;[video=640x400]
;[video=640x400@70.1]

; ========================================
; MODERN FRONTEND SETTINGS
; ========================================

; --- Boxart ---
; Enable boxart display in menu (0=disabled, 1=enabled)
boxart_enable=1
boxart_show_preview=1
boxart_path=media

; --- Graphical Menu ---
; 0=classic OSD, 1=modern graphical menu
gfx_menu_enable=1
; View mode: 0=list, 1=grid, 2=wheel carousel
gfx_menu_view=1
; Themes: dark, light, retro, neon, minimal (or custom filename)
gfx_menu_theme=dark

; --- Animations ---
; Enable smooth menu animations
anim_enable=1
; Speed: 1=slowest, 5=default, 10=fastest
anim_speed=5

; --- Search ---
; Fuzzy search: 0=exact match, 1=fuzzy matching
search_fuzzy=1
; On-screen keyboard: 0=text only, 1=show keyboard
search_show_keyboard=1

; --- Core Settings ---
; Unified settings menu across all cores
core_settings_unified=1
; Auto-save settings on exit
core_settings_autosave=1

; --- Favorites & Recents ---
favorites_enable=1
; Number of recent games to track (0-50)
recent_games_count=20

; --- Game Database ---
; Enable metadata from No-Intro DAT files
gamedb_enable=1
gamedb_path=gamedb

